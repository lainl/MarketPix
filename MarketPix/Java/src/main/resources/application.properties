spring.application.name=marketpix-api
server.port=${PORT:${SERVER_PORT:8000}}
marketpix.images.temp-dir=${java.io.tmpdir}/marketpix/images
# Keep the key out of this file: set OPENAI_API_KEY (as on Railway), or for local runs put it in
# openai-api-key.txt next to pom.xml, which git ignores.
openai.api.key=
openai.api.key-file=openai-api-key.txt
openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5.4-mini}
openai.vision.model=${OPENAI_VISION_MODEL:gpt-5.5}
openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-2.5-flare}
openai.image.size=${OPENAI_IMAGE_SIZE:2048x2048}
# Finished images are saved to Cloudflare R2 under a generated id (day, time, month, year, letter, 4 digits).
# Storage stays off until the keys are set; prefer the R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY variables.
r2.account-id=${R2_ACCOUNT_ID:523b646c10170469fea93563a6142d27}
r2.bucket=${R2_BUCKET:marketpix-images}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key-id=
r2.secret-access-key=
# Time zone used for the id; blank uses the server's.
marketpix.id.timezone=${MARKETPIX_ID_TIMEZONE:}
# Optional background scene uploads; false ignores them and uses white.
marketpix.background.enabled=${MARKETPIX_BACKGROUND_ENABLED:true}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=300MB
spring.mvc.async.request-timeout=-1
# Login for the web interface; every /api route except /api/health needs a session token.
marketpix.auth.username=${MARKETPIX_USERNAME:marketpixs}
marketpix.auth.password=${MARKETPIX_PASSWORD:pixs1234}
# Bulk edit reads folders shared with this Dropbox account. Prefer the refresh token (with the app
# key and secret); a plain access token works for testing but expires after a few hours.
dropbox.account-email=${DROPBOX_ACCOUNT_EMAIL:marketpixs@gmail.com}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.app-key=${DROPBOX_APP_KEY:}
dropbox.app-secret=${DROPBOX_APP_SECRET:}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}
# Shown before a bulk job starts: estimated USD per photo (edit plus detail check, retries averaged in)
# and per item (one object analysis across the item's photos).
marketpix.bulk.cost-per-photo=${MARKETPIX_BULK_COST_PER_PHOTO:0.25}
marketpix.bulk.cost-per-item=${MARKETPIX_BULK_COST_PER_ITEM:0.02}
marketpix.bulk.max-photos=${MARKETPIX_BULK_MAX_PHOTOS:1000}

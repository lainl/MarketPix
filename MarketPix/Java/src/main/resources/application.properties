spring.application.name=marketpix-api
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]
server.port=${PORT}
server.forward-headers-strategy=native
marketpix.images.temp-dir=${java.io.tmpdir}/marketpix/images
marketpix.ui-dir=${MARKETPIX_UI_DIR}
marketpix.imagemagick=${MARKETPIX_IMAGEMAGICK}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=300MB
spring.mvc.async.request-timeout=-1

openai.api.key=${OPENAI_API_KEY}
openai.chat.model=${OPENAI_CHAT_MODEL}
openai.vision.model=${OPENAI_VISION_MODEL}
openai.image.model=${OPENAI_IMAGE_MODEL}
openai.image.size=${OPENAI_IMAGE_SIZE}
openai.image.bulk-model=${OPENAI_BULK_IMAGE_MODEL}
openai.image.bulk-size=${OPENAI_BULK_IMAGE_SIZE}
openai.image.bulk-quality=${OPENAI_BULK_IMAGE_QUALITY}

r2.account-id=${R2_ACCOUNT_ID}
r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
marketpix.id.timezone=${MARKETPIX_ID_TIMEZONE}
marketpix.background.enabled=${MARKETPIX_BACKGROUND_ENABLED}

marketpix.auth.username=${MARKETPIX_USERNAME}
marketpix.auth.password=${MARKETPIX_PASSWORD}
marketpix.auth.session-days=${MARKETPIX_SESSION_DAYS}
marketpix.auth.session-file=${MARKETPIX_SESSION_FILE}

dropbox.account-email=${DROPBOX_ACCOUNT_EMAIL}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN}
dropbox.app-key=${DROPBOX_APP_KEY}
dropbox.app-secret=${DROPBOX_APP_SECRET}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN}
marketpix.bulk.cost-per-photo=${MARKETPIX_BULK_COST_PER_PHOTO}
marketpix.bulk.cost-per-item=${MARKETPIX_BULK_COST_PER_ITEM}
marketpix.bulk.max-photos=${MARKETPIX_BULK_MAX_PHOTOS}
marketpix.bulk.ai-editing=${MARKETPIX_BULK_AI_EDITING}
marketpix.bulk.jobs-dir=${MARKETPIX_BULK_JOBS_DIR}
